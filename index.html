<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บัญชีรายรับรายจ่าย</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EEF3F1;--surface:#FFFFFF;--ink:#17302B;--muted:#5E736E;--line:#D5E0DC;
  --inc:#157A55;--inc-bg:#DDF1E8;--exp:#C0392B;--exp-bg:#FBE4E0;--accent:#17302B;--on-accent:#FFFFFF;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A18;--surface:#182623;--ink:#E4EFEC;--muted:#93ABA5;--line:#2A3D39;
    --inc:#4FD1A0;--inc-bg:#173A2E;--exp:#FF8A7A;--exp-bg:#43211D;--accent:#E4EFEC;--on-accent:#0F1A18;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A18;--surface:#182623;--ink:#E4EFEC;--muted:#93ABA5;--line:#2A3D39;
  --inc:#4FD1A0;--inc-bg:#173A2E;--exp:#FF8A7A;--exp-bg:#43211D;--accent:#E4EFEC;--on-accent:#0F1A18;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai","Noto Sans Thai",Tahoma,sans-serif;font-size:16px;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:20px;margin:4px 0 14px;font-weight:700}
h2{font-size:16px;margin:0 0 12px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.nav{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.nav select,.nav button,input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:44px}
.nav select{flex:1;min-width:0}
.nav button{width:44px;padding:0;cursor:pointer;font-size:18px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--inc);outline-offset:2px}
.bal{font-size:34px;font-weight:700;line-height:1.2;margin:0}
.bal.neg{color:var(--exp)}
.lbl{color:var(--muted);font-size:14px;margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pill{border-radius:10px;padding:10px 12px}
.pill.i{background:var(--inc-bg);color:var(--inc)}
.pill.e{background:var(--exp-bg);color:var(--exp)}
.pill b{display:block;font-size:18px}
.chart{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:130px}
.col{background:none;border:0;padding:0;cursor:pointer;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;color:var(--muted);font:inherit;font-size:11px}
.bars{display:flex;align-items:flex-end;gap:2px;height:100px;width:100%;justify-content:center}
.bars i{display:block;width:42%;min-height:2px;border-radius:3px 3px 0 0}
.bars .bi{background:var(--inc)}.bars .be{background:var(--exp)}
.col.sel{color:var(--ink);font-weight:700}
.col.sel .bars{background:var(--bg);border-radius:6px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-weight:600;cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"].i{background:var(--inc);border-color:var(--inc);color:#fff}
.seg button[aria-pressed="true"].e{background:var(--exp);border-color:var(--exp);color:#fff}
.dark-fix{}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form .full{grid-column:1/-1}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
input,select{width:100%}
.save{grid-column:1/-1;background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;font:inherit;font-weight:600;min-height:48px;cursor:pointer}
.cat{margin-bottom:10px}
.cat .r{display:flex;justify-content:space-between;font-size:15px}
.cat .t{height:8px;background:var(--bg);border-radius:4px;margin-top:4px;overflow:hidden}
.cat .t i{display:block;height:100%;background:var(--exp);border-radius:4px}
.day{font-size:14px;color:var(--muted);margin:14px 0 6px;font-weight:600}
.day:first-of-type{margin-top:0}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item .m{flex:1;min-width:0}
.item .m b{font-weight:500;display:block}
.item .m span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.amt{font-weight:600;white-space:nowrap}
.amt.i{color:var(--inc)}.amt.e{color:var(--exp)}
.del{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;min-height:36px;padding:0 10px;font:inherit;font-size:13px;cursor:pointer}
.del.ask{background:var(--exp);border-color:var(--exp);color:#fff}
.empty{color:var(--muted);text-align:center;padding:18px 0;margin:0}
.wrap{overflow-x:auto}
.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{font-weight:600;color:var(--muted);text-align:right;padding:6px 6px;border-bottom:1px solid var(--line)}
.tb td{padding:8px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.tb th:first-child,.tb td:first-child{text-align:left}
.tb .i{color:var(--inc)}.tb .e{color:var(--exp)}
.tb tr[data-m]{cursor:pointer}
.tb tr.sel td{background:var(--bg);font-weight:600}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mh h2{margin:0}
.mh span{display:flex;gap:6px}
.ar{width:44px;height:44px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;cursor:pointer;font-size:14px}
.mscroll{overflow-y:auto}
.mscroll .tb th{position:sticky;top:0;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.yt{margin:10px 0 0;font-size:14px;color:var(--muted)}
.gi{color:var(--inc)}.ge{color:var(--exp)}
</style>
</head>
<body>
<main>
  <h1>บัญชีรายรับรายจ่าย</h1>

  <div class="nav">
    <button id="prev" aria-label="เดือนก่อนหน้า">‹</button>
    <select id="selM" aria-label="เดือน"></select>
    <select id="selY" aria-label="ปี"></select>
    <button id="next" aria-label="เดือนถัดไป">›</button>
  </div>

  <section class="card" id="sum"></section>

  <section class="card">
    <h2 id="chartT"></h2>
    <div class="chart" id="chart"></div>
    <div class="legend"><span><i class="dot" style="background:var(--inc)"></i>รายรับ</span><span><i class="dot" style="background:var(--exp)"></i>รายจ่าย</span></div>
  </section>

  <section class="card" id="mtab"></section>
  <section class="card" id="dtab"></section>

  <section class="card">
    <h2>เพิ่มรายการ</h2>
    <div class="seg" role="group" aria-label="ประเภทรายการ">
      <button type="button" class="e" id="tE" aria-pressed="true">รายจ่าย</button>
      <button type="button" class="i" id="tI" aria-pressed="false">รายรับ</button>
    </div>
    <form id="f">
      <div><label for="fd">วันที่</label><input type="date" id="fd" required></div>
      <div><label for="fa">จำนวนเงิน (บาท)</label><input type="number" id="fa" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" required></div>
      <div class="full"><label for="fc">หมวดหมู่</label><select id="fc"></select></div>
      <div class="full"><label for="fn">บันทึกเพิ่มเติม</label><input type="text" id="fn" maxlength="80" placeholder="เช่น ข้าวกลางวัน"></div>
      <button class="save" type="submit">บันทึกรายการ</button>
    </form>
  </section>

  <section class="card" id="cats"></section>
  <section class="card" id="list"></section>
</main>

<script>
(function(){
var MONTHS=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
var SHORT=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
var CATS={e:['อาหาร','เดินทาง','ที่พัก','ช้อปปิ้ง','ค่าน้ำ ค่าไฟ ค่าเน็ต','สุขภาพ','บันเทิง','อื่นๆ'],i:['เงินเดือน','โบนัส','ขายของ/ธุรกิจ','ของขวัญ','อื่นๆ']};
var KEY='thai-ledger-v1';
var tx=[];
try{var raw=localStorage.getItem(KEY);if(raw)tx=JSON.parse(raw)||[];}catch(e){tx=[];}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tx));}catch(e){}}
var now=new Date();
var Y=now.getFullYear(),M=now.getMonth(),type='e';
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return Number(n).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2})}
function pad(n){return n<10?'0'+n:''+n}
function ym(d){return d.slice(0,7)}
function key(y,m){return y+'-'+pad(m+1)}

function totals(y,m){
  var k=key(y,m),i=0,e=0;
  tx.forEach(function(t){if(ym(t.date)===k){if(t.type==='i')i+=t.amt;else e+=t.amt;}});
  return {i:i,e:e};
}
function fillSelects(){
  $('selM').innerHTML=MONTHS.map(function(n,i){return '<option value="'+i+'">'+n+'</option>'}).join('');
  var ys={};ys[Y]=1;
  for(var y0=2026;y0<=2030;y0++)ys[y0]=1;
  tx.forEach(function(t){ys[+t.date.slice(0,4)]=1});
  $('selY').innerHTML=Object.keys(ys).sort().map(function(y){return '<option value="'+y+'">ค.ศ. '+y+'</option>'}).join('');
  $('selM').value=M;$('selY').value=Y;
}
function setCats(){
  $('fc').innerHTML=CATS[type].map(function(c){return '<option>'+esc(c)+'</option>'}).join('');
  $('tE').setAttribute('aria-pressed',type==='e');
  $('tI').setAttribute('aria-pressed',type==='i');
}
function defaultDate(){
  var d=(Y===now.getFullYear()&&M===now.getMonth())?now.getDate():1;
  $('fd').value=Y+'-'+pad(M+1)+'-'+pad(d);
}
function render(){
  fillSelects();
  var t=totals(Y,M),bal=t.i-t.e;
  $('sum').innerHTML='<p class="lbl">คงเหลือ '+MONTHS[M]+' '+Y+'</p>'+
    '<p class="bal'+(bal<0?' neg':'')+'">'+(bal<0?'−':'')+'฿'+money(Math.abs(bal))+'</p>'+
    '<div class="two"><div class="pill i"><span>รายรับ</span><b>฿'+money(t.i)+'</b></div>'+
    '<div class="pill e"><span>รายจ่าย</span><b>฿'+money(t.e)+'</b></div></div>';
  // chart
  $('chartT').textContent='สรุปรายเดือน ค.ศ. '+Y;
  var data=[],max=1;
  for(var m=0;m<12;m++){var x=totals(Y,m);data.push(x);max=Math.max(max,x.i,x.e);}
  $('chart').innerHTML=data.map(function(x,m){
    return '<button class="col'+(m===M?' sel':'')+'" data-m="'+m+'" aria-label="'+MONTHS[m]+' รายรับ '+money(x.i)+' รายจ่าย '+money(x.e)+' บาท">'+
      '<span class="bars"><i class="bi" style="height:'+(x.i/max*100)+'%"></i><i class="be" style="height:'+(x.e/max*100)+'%"></i></span>'+SHORT[m]+'</button>';
  }).join('');
  // monthly table
  var yi=0,ye=0;
  $('mtab').innerHTML='<div class="mh"><h2>สรุปรายเดือน ค.ศ. '+Y+'</h2><span><button type="button" class="ar" id="mUp" aria-label="เลื่อนขึ้น 3 เดือน">▲</button><button type="button" class="ar" id="mDn" aria-label="เลื่อนลง 3 เดือน">▼</button></span></div><div class="wrap mscroll" id="mscroll"><table class="tb"><thead><tr><th>เดือน</th><th>รายรับ</th><th>รายจ่าย</th><th>คงเหลือ</th></tr></thead><tbody>'+
    data.map(function(x,m){yi+=x.i;ye+=x.e;var n=x.i-x.e;
      return '<tr data-m="'+m+'"'+(m===M?' class="sel"':'')+'><td>'+MONTHS[m]+'</td><td class="i">'+money(x.i)+'</td><td class="e">'+money(x.e)+'</td><td class="'+(n<0?'e':'i')+'">'+(n<0?'−':'')+money(Math.abs(n))+'</td></tr>';}).join('')+
    '</tbody></table></div><p class="yt">รวมทั้งปี รายรับ <b class="gi">'+money(yi)+'</b> รายจ่าย <b class="ge">'+money(ye)+'</b> คงเหลือ <b class="'+(yi-ye<0?'ge':'gi')+'">'+(yi-ye<0?'−':'')+money(Math.abs(yi-ye))+'</b></p>';
  var ms=$('mscroll'),th=ms.querySelector('thead').offsetHeight,rh=ms.querySelector('tbody tr').offsetHeight;
  ms.style.maxHeight=(th+rh*3)+'px';ms.scrollTop=Math.floor(M/3)*3*rh;
  $('mUp').onclick=function(){ms.scrollBy({top:-rh*3,behavior:'smooth'})};
  $('mDn').onclick=function(){ms.scrollBy({top:rh*3,behavior:'smooth'})};
  // daily table
  var WD=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'],dk=key(Y,M),dm={};
  tx.forEach(function(a){if(ym(a.date)===dk){var d=+a.date.slice(8);dm[d]=dm[d]||{i:0,e:0};dm[d][a.type]+=a.amt;}});
  var dl=Object.keys(dm).map(Number).sort(function(a,b){return a-b});
  $('dtab').innerHTML='<h2>สรุปรายวัน '+MONTHS[M]+' '+Y+'</h2>'+(dl.length?'<div class="wrap"><table class="tb"><thead><tr><th>วันที่</th><th>รายรับ</th><th>รายจ่าย</th><th>สุทธิ</th></tr></thead><tbody>'+
    dl.map(function(d){var x=dm[d],n=x.i-x.e;
      return '<tr><td>'+d+' ('+WD[new Date(Y,M,d).getDay()]+')</td><td class="i">'+(x.i?money(x.i):'-')+'</td><td class="e">'+(x.e?money(x.e):'-')+'</td><td class="'+(n<0?'e':'i')+'">'+(n<0?'−':'')+money(Math.abs(n))+'</td></tr>';}).join('')+
    '</tbody></table></div>':'<p class="empty">ยังไม่มีรายการในเดือนนี้</p>');
  // categories
  var k=key(Y,M),cm={},items=tx.filter(function(a){return ym(a.date)===k});
  items.forEach(function(a){if(a.type==='e')cm[a.cat]=(cm[a.cat]||0)+a.amt});
  var cl=Object.keys(cm).sort(function(a,b){return cm[b]-cm[a]});
  $('cats').innerHTML='<h2>รายจ่ายแยกตามหมวด</h2>'+(cl.length?cl.map(function(c){
    var p=t.e?cm[c]/t.e*100:0;
    return '<div class="cat"><div class="r"><span>'+esc(c)+'</span><span>฿'+money(cm[c])+' ('+Math.round(p)+'%)</span></div><div class="t"><i style="width:'+p+'%"></i></div></div>';
  }).join(''):'<p class="empty">ยังไม่มีรายจ่ายในเดือนนี้</p>');
  // list
  items.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id});
  var h='<h2>รายการทั้งหมด ('+items.length+')</h2>',last='';
  if(!items.length)h+='<p class="empty">ยังไม่มีรายการ เพิ่มรายการแรกได้ที่แบบฟอร์มด้านบน</p>';
  items.forEach(function(a){
    if(a.date!==last){last=a.date;h+='<div class="day">'+(+a.date.slice(8))+' '+MONTHS[+a.date.slice(5,7)-1]+'</div>';}
    h+='<div class="item"><div class="m"><b>'+esc(a.cat)+'</b>'+(a.note?'<span>'+esc(a.note)+'</span>':'')+'</div>'+
      '<span class="amt '+a.type+'">'+(a.type==='i'?'+':'−')+'฿'+money(a.amt)+'</span>'+
      '<button class="del" data-id="'+a.id+'">ลบ</button></div>';
  });
  $('list').innerHTML=h;
}
function go(y,m){Y=y;M=m;defaultDate();render();}
$('prev').onclick=function(){if(Y<=2026&&M===0)return;go(M===0?Y-1:Y,M===0?11:M-1)};
$('next').onclick=function(){if(Y>=2030&&M===11)return;go(M===11?Y+1:Y,M===11?0:M+1)};
$('selM').onchange=function(){go(Y,+this.value)};
$('selY').onchange=function(){go(+this.value,M)};
$('chart').onclick=function(e){var b=e.target.closest('.col');if(b)go(Y,+b.dataset.m)};
$('tE').onclick=function(){type='e';setCats()};
$('tI').onclick=function(){type='i';setCats()};
$('f').onsubmit=function(e){
  e.preventDefault();
  var amt=parseFloat($('fa').value);
  if(!(amt>0)||!$('fd').value)return;
  var d=$('fd').value;
  tx.push({id:Date.now(),date:d,type:type,cat:$('fc').value,amt:amt,note:$('fn').value.trim()});
  save();
  Y=+d.slice(0,4);M=+d.slice(5,7)-1;
  $('fa').value='';$('fn').value='';
  render();
};
var askTimer;
$('list').onclick=function(e){
  var b=e.target.closest('.del');if(!b)return;
  if(b.classList.contains('ask')){
    tx=tx.filter(function(a){return String(a.id)!==b.dataset.id});save();render();return;
  }
  Array.prototype.forEach.call(document.querySelectorAll('.del.ask'),function(x){x.classList.remove('ask');x.textContent='ลบ'});
  b.classList.add('ask');b.textContent='ยืนยันลบ';
  clearTimeout(askTimer);askTimer=setTimeout(function(){b.classList.remove('ask');b.textContent='ลบ'},3000);
};
$('mtab').onclick=function(e){var r=e.target.closest('tr[data-m]');if(r)go(Y,+r.dataset.m)};
setCats();defaultDate();render();
})();
</script>
</body>
</html>
